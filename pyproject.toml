[project]
name = "info-agent"
version = "0.1.0"
description = "No-paid-API RSS information collection agent that writes daily Markdown reports."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
info-agent-daily = "info_agent.cli:main"
info-agent-weather = "info_agent.weather_cache:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
